<svg xmlns="http://www.w3.org/2000/svg" width="580" height="389" viewBox="0 0 580 389" role="img" aria-label="Deployment Automation Tool: Workflow engine that deploys GitHub repos with resume, retries and approval gates. Works: Persisted run and step state machines, background runs, repo analyzer; static deploys verified on Vercel / Netlify. Metric: 6 platform adapters · 2 verified end-to-end"><title>Deployment Automation Tool: Workflow engine that deploys GitHub repos with resume, retries and approval gates. Works: Persisted run and step state machines, background runs, repo analyzer; static deploys verified on Vercel / Netlify. Metric: 6 platform adapters · 2 verified end-to-end</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1" y="1" width="578" height="387" rx="14" fill="#111821" stroke="#1f2a37" stroke-width="1.5"/><rect x="26" y="26" width="66" height="66" rx="12" fill="#0b1f2a" stroke="#1f2a37"/><g transform="translate(43.0,43.0) scale(1.333)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="12" r="2.5"/><path d="M5 8.5v7M7.3 6.9l9.4 4M7.3 17.1l9.4-4"/></g><text x="112.0" y="52.0" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="0">Deployment Automation Tool</text><text x="554.0" y="50.0" font-size="13.5" fill="#58a6ff" font-weight="400" text-anchor="end" letter-spacing="0">repo ↗</text><text x="112.0" y="78.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Workflow engine that deploys GitHub repos with</text><text x="112.0" y="102.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">resume, retries and approval gates.</text><text x="112.0" y="128.0" font-size="13.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">Resume 