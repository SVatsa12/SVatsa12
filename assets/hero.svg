<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="637" viewBox="0 0 1200 637" role="img" aria-label="SVATSA(1) — Shubham Vatsa: Backend Systems · Full-Stack Development · Applied AI. Builds systems where state is explicit, failure is planned for, and AI is a component — not the architecture. Most of the work: FastAPI and Node backends, real-time pipelines, schema design and LLM integration, with a React front end on top."><title>SVATSA(1) — Shubham Vatsa: Backend Systems · Full-Stack Development · Applied AI. Builds systems where state is explicit, failure is planned for, and AI is a component — not the architecture. Most of the work: FastAPI and Node backends, real-time pipelines, schema design and LLM integration, with a React front end on top.</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1" y="1" width="1198" height="635" rx="14" fill="#0d1117" stroke="#1f2a37" stroke-width="1.5"/><text x="48.0" y="54.0" font-size="16" fill="#2dd4bf" font-weight="600" text-anchor="start" letter-spacing="1.5">SVATSA(1)</text><text x="176.0" y="54.0" font-size="14" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="1.5">·  ENGINEERING MANUAL</text><rect x="907.6" y="34" width="244.4" height="30" rx="15" fill="#3ddc97" fill-opacity=".08" stroke="#3ddc97" stroke-width="1.3"/><circle cx="925.625" cy="49" r="4.5" fill="#3ddc97"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="939.6" y="53.5" font-size="12.5" fill="#3ddc97" font-weight="600" text-anchor="start" letter-spacing="1">OPEN TO SDE INTERNSHIPS</text><line x1="48" y1="80" x2="1152" y2="80" stroke="#202833" stroke-width="1.2"/><text x="44.0" y="166.0" font-size="86" fill="#3ddc97" font-weight="800" text-anchor="start" letter-spacing="2">SVATSA</text><text x="398.8" y="132.0" font-size="22" fill="#e6edf3" font-weight="600" text-anchor="start" letter-spacing="0">Shubham Vatsa</text><text x="398.8" y="162.0" font-size="15" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">github.com/SVatsa12</text><text x="48.0" y="206.0" font-size="20" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">Backend Systems · Full-Stack Development · Applied AI</text><line x1="48" y1="234" x2="1152" y2="234" stroke="#202833" stroke-width="1.2"/><text x="48.0" y="276.0" font-size="17" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">NAME</text><text x="84.0" y="306.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">svatsa — backend-first engineer. Final-year B.E. ISE,</text><text x="84.0" y="328.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">JSSATE Bengaluru.</text><text x="48.0" y="368.0" font-size="17" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">SYNOPSIS</text><rect x="84" y="384" width="534" height="44" rx="8" fill="#111821" stroke="#1f2a37"/><text x="102.0" y="412.0" font-size="16" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0"><tspan fill="#3ddc97">svatsa</tspan> <tspan fill="#c9d1d9">[</tspan><tspan fill="#2dd4bf">--backend</tspan><tspan fill="#c9d1d9">] [</tspan><tspan fill="#2dd4bf">--realtime</tspan><tspan fill="#c9d1d9">] [</tspan><tspan fill="#2dd4bf">--llm</tspan><tspan fill="#c9d1d9">]</tspan><tspan dx="10" fill="#f0b429">&lt;problem&gt;</tspan></text><text x="48.0" y="466.0" font-size="17" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">DESCRIPTION</text><text x="84.0" y="496.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Builds systems where state is explicit, failure is</text><text x="84.0" y="519.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">planned for, and AI is a component — not the</text><text x="84.0" y="542.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">architecture. Most of the work: FastAPI and Node</text><text x="84.0" y="565.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">backends, real-time pipelines, schema design and LLM</text><text x="84.0" y="588.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">integration, with a React front end on top.</text><line x1="630" y1="256" x2="630" y2="605" stroke="#202833" stroke-width="1.2"/><text x="664.0" y="276.0" font-size="17" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">OPTIONS</text><text x="756.0" y="276.0" font-size="14" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">(stack)</text><g transform="translate(664.0,304.0) scale(0.833)" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></g><text x="696.0" y="319.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">--lang</text><text x="784.0" y="319.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">Java · Python · JavaScript · SQL</text><g transform="translate(664.0,354.5) scale(0.833)" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></g><text x="696.0" y="369.5" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">--backend</text><text x="784.0" y="369.5" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">FastAPI · Node.js · Express · WebSockets</text><g transform="translate(664.0,405.0) scale(0.833)" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></g><text x="696.0" y="420.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">--frontend</text><text x="784.0" y="420.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">React · Vite · Tailwind · Three.js</text><g transform="translate(664.0,455.5) scale(0.833)" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="696.0" y="470.5" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">--data</text><text x="784.0" y="470.5" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">PostgreSQL · Prisma · MongoDB · SQLite</text><g transform="translate(664.0,506.0) scale(0.833)" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.4z"/><path d="M19 17v4M17 19h4"/></g><text x="696.0" y="521.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">--ai</text><text x="784.0" y="521.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">LLM APIs · Whisper · Ollama · RAG</text><g transform="translate(664.0,556.5) scale(0.833)" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></g><text x="696.0" y="571.5" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">--infra</text><text x="784.0" y="571.5" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">Docker · GitHub Actions · Linux</text></svg>
