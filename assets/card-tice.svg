<svg xmlns="http://www.w3.org/2000/svg" width="580" height="389" viewBox="0 0 580 389" role="img" aria-label="TICE: Threat Intelligence Correlation Engine — one IP in, one explained risk score out. Works: AbuseIPDB, Shodan and IPInfo correlated into one profile; Gemini report with a template fallback; mock mode. Metric: Top 5 / ~400 teams · AXIOM Hackathon"><title>TICE: Threat Intelligence Correlation Engine — one IP in, one explained risk score out. Works: AbuseIPDB, Shodan and IPInfo correlated into one profile; Gemini report with a template fallback; mock mode. Metric: Top 5 / ~400 teams · AXIOM Hackathon</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1" y="1" width="578" height="387" rx="14" fill="#111821" stroke="#1f2a37" stroke-width="1.5"/><rect x="26" y="26" width="66" height="66" rx="12" fill="#0b1f2a" stroke="#1f2a37"/><g transform="translate(43.0,43.0) scale(1.333)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></g><text x="112.0" y="52.0" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="0">TICE</text><text x="554.0" y="50.0" font-size="13.5" fill="#58a6ff" font-weight="400" text-anchor="end" letter-spacing="0">repo ↗</text><text x="112.0" y="78.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Threat Intelligence Correlation Engine — one IP</text><text x="112.0" y="102.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">in, one explained risk score out.</text><text x="112.0" y="128.0" font-size="13.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">OSINT correlation · Risk scoring · AI reports</text><line x1="26" y1="136" x2="554" y2="136" stroke="#202833" stroke-width="1.2"/><text x="26.0" y="164.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">WORKS</text><text x="118.0" y="164.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">AbuseIPDB, Shodan and IPInfo correlated into one</text><text x="118.0" y="185.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">profile; Gemini report with a template fallback;</text><text x="118.0" y="206.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">mock mode.</text><text x="26.0" y="239.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.2">HARD PART</text><text x="118.0" y="239.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Weights re-normalise over the sources that answered</text><text x="118.0" y="260.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">— a missing key changes confidence, not scale.</text><text x="26.0" y="295.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">METRIC</text><text x="118.0" y="295.0" font-size="14" fill="#f0b429" font-weight="600" text-anchor="start" letter-spacing="0">Top 5 / ~400 teams · AXIOM Hackathon</text><rect x="26.0" y="336.0" width="75.4" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="63.7" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">FastAPI</text><rect x="109.4" y="336.0" width="83.0" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="150.9" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">React 19</text><rect x="200.4" y="336.0" width="83.0" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="241.9" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Three.js</text><rect x="291.4" y="336.0" width="75.4" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="329.1" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">MongoDB</text><rect x="374.8" y="336.0" width="67.8" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="408.6" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Gemini</text></svg>
