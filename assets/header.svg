<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Shubham Vatsa — Engineering Logbook</title>
  <desc id="d">Final-year Information Science and Engineering student building backend systems, full-stack products and applied AI.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b222c" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif}
    </style>
  </defs>

  <rect width="1200" height="340" rx="14" fill="#0d1117"/>
  <rect width="1200" height="340" rx="14" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="14" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#21262d"/>

  <!-- top rail -->
  <text x="56" y="58" class="mono" font-size="13" letter-spacing="3.5" fill="#2dd4bf">ENGINEERING LOGBOOK</text>
  <text x="1144" y="58" class="mono" font-size="13" letter-spacing="1.5" fill="#6e7681" text-anchor="end">github.com/SVatsa12 · vol. 2026.11</text>
  <line x1="56" y1="76" x2="1144" y2="76" stroke="#21262d"/>

  <!-- name + statement -->
  <text x="54" y="152" class="sans" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#e6edf3">Shubham Vatsa</text>
  <rect x="56" y="178" width="4" height="40" fill="#2dd4bf"/>
  <text x="76" y="196" class="sans" font-size="21" fill="#c9d1d9">Backend-first engineer. I build systems where state is explicit,</text>
  <text x="76" y="222" class="sans" font-size="21" fill="#c9d1d9">failure is planned for, and AI is a component — not the architecture.</text>

  <!-- entry index -->
  <g class="mono" font-size="13">
    <text x="944" y="116" fill="#6e7681" letter-spacing="2">ENTRIES</text>
    <text x="944" y="142" fill="#2dd4bf">01</text><text x="976" y="142" fill="#8b949e">StandNote.AI</text>
    <text x="944" y="164" fill="#2dd4bf">02</text><text x="976" y="164" fill="#8b949e">Deployment Engine</text>
    <text x="944" y="186" fill="#2dd4bf">03</text><text x="976" y="186" fill="#8b949e">TICE</text>
    <text x="944" y="208" fill="#2dd4bf">04</text><text x="976" y="208" fill="#8b949e">SnapLink</text>
  </g>

  <!-- metadata strip -->
  <line x1="56" y1="258" x2="1144" y2="258" stroke="#21262d"/>
  <g class="mono" font-size="13">
    <text x="56" y="290" fill="#6e7681">ROLE</text>
    <text x="56" y="310" fill="#c9d1d9">SDE · Full-stack · Backend</text>

    <text x="330" y="290" fill="#6e7681">EDUCATION</text>
    <text x="330" y="310" fill="#c9d1d9">B.E. ISE · final year · '27</text>

    <text x="604" y="290" fill="#6e7681">BASE</text>
    <text x="604" y="310" fill="#c9d1d9">JSSATE · Bengaluru</text>

    <text x="878" y="290" fill="#6e7681">STATUS</text>
    <circle cx="884" cy="305" r="4" fill="#2dd4bf"/>
