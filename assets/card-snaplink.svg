<svg xmlns="http://www.w3.org/2000/svg" width="580" height="389" viewBox="0 0 580 389" role="img" aria-label="SnapLink: URL shortener with accounts, ownership checks and click analytics. Works: JWT auth, 7-char nanoid codes, per-link analytics, owner-only stats and delete. Metric: &lt;50ms lookups · 1,000+ records"><title>SnapLink: URL shortener with accounts, ownership checks and click analytics. Works: JWT auth, 7-char nanoid codes, per-link analytics, owner-only stats and delete. Metric: &lt;50ms lookups · 1,000+ records</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1" y="1" width="578" height="387" rx="14" fill="#111821" stroke="#1f2a37" stroke-width="1.5"/><rect x="26" y="26" width="66" height="66" rx="12" fill="#0b1f2a" stroke="#1f2a37"/><g transform="translate(43.0,43.0) scale(1.333)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></g><text x="112.0" y="52.0" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="0">SnapLink</text><text x="554.0" y="50.0" font-size="13.5" fill="#58a6ff" font-weight="400" text-anchor="end" letter-spacing="0">repo ↗</text><text x="112.0" y="78.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">URL shortener with accounts, ownership checks</text><text x="112.0" y="102.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">and click analytics.</text><text x="112.0" y="128.0" font-size="13.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">Shorten · Redirect · Analytics</text><line x1="26" y1="136" x2="554" y2="136" stroke="#202833" stroke-width="1.2"/><text x="26.0" y="164.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">WORKS</text><text x="118.0" y="164.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">JWT auth, 7-char nanoid codes, per-link analytics,</text><text x="118.0" y="185.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">owner-only stats and delete.</text><text x="26.0" y="218.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.2">HARD PART</text><text x="118.0" y="218.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">A redirect is one indexed read plus one atomic</text><text x="118.0" y="239.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">increment; indexes are shaped around the two hot</text><text x="118.0" y="260.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">queries.</text><text x="26.0" y="295.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">METRIC</text><text x="118.0" y="295.0" font-size="14" fill="#f0b429" font-weight="600" text-anchor="start" letter-spacing="0">&lt;50ms lookups · 1,000+ records</text><rect x="26.0" y="336.0" width="75.4" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="63.7" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Node.js</text><rect x="109.4" y="336.0" width="75.4" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="147.1" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Express</text><rect x="192.8" y="336.0" width="67.8" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="226.6" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Prisma</text><rect x="268.5" y="336.0" width="98.2" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="317.6" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">PostgreSQL</text><rect x="374.8" y="336.0" width="67.8" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="408.6" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Docker</text></svg>
