<svg xmlns="http://www.w3.org/2000/svg" width="590" height="340" viewBox="0 0 590 340" role="img" aria-label="Engineering principles: Design the degraded path first. State belongs in a table, not a variable. The hot path gets the index. One layer, one job. AI sits behind a function boundary."><title>Engineering principles: Design the degraded path first. State belongs in a table, not a variable. The hot path gets the index. One layer, one job. AI sits behind a function boundary.</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1" y="1" width="588" height="338" rx="14" fill="#0d1117" stroke="#1f2a37" stroke-width="1.5"/><g transform="translate(30.0,32.0) scale(0.958)" fill="none" stroke="#3ddc97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></g><text x="65.0" y="50.0" font-size="19" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.2">ENGINEERING PRINCIPLES</text><text x="30.0" y="100.0" font-size="18" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="0">›</text><text x="52.0" y="100.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">Design the degraded path first.</text><text x="52.0" y="121.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">→ TICE: template fallback · mock mode</text><text x="30.0" y="144.0" font-size="18" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="0">›</text><text x="52.0" y="144.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">State belongs in a table, not a variable.</text><text x="52.0" y="165.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">→ Deploy Tool: persisted run + step state</text><text x="30.0" y="188.0" font-size="18" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="0">›</text><text x="52.0" y="188.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">The hot path gets the index.</text><text x="52.0" y="209.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">→ SnapLink: indexes shaped around redirects</text><text x="30.0" y="232.0" font-size="18" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="0">›</text><text x="52.0" y="232.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">One layer, one job.</text><text x="52.0" y="253.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">→ routes → controllers → middleware</text><text x="30.0" y="276.0" font-size="18" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="0">›</text><text x="52.0" y="276.0" font-size="14.5" fill="#e6edf3" font-weight="400" text-anchor="start" letter-spacing="0">AI sits behind a function boundary.</text><text x="52.0" y="297.0" font-size="12.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">→ Groq · Ollama · Gemini are swappable calls</text></svg>
