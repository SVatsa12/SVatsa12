<svg xmlns="http://www.w3.org/2000/svg" width="580" height="389" viewBox="0 0 580 389" role="img" aria-label="StandNote.AI: Real-time meeting intelligence that runs beside Meet, Zoom and Teams — it never hosts the call. Works: Tab audio → WebSocket → Whisper captions, saved transcripts, Llama 3 summaries and action items. Metric: &lt;2s caption latency · 5+ concurrent streams"><title>StandNote.AI: Real-time meeting intelligence that runs beside Meet, Zoom and Teams — it never hosts the call. Works: Tab audio → WebSocket → Whisper captions, saved transcripts, Llama 3 summaries and action items. Metric: &lt;2s caption latency · 5+ concurrent streams</title><style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><rect x="1" y="1" width="578" height="387" rx="14" fill="#111821" stroke="#1f2a37" stroke-width="1.5"/><rect x="26" y="26" width="66" height="66" rx="12" fill="#0b1f2a" stroke="#1f2a37"/><g transform="translate(43.0,43.0) scale(1.333)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></g><text x="112.0" y="52.0" font-size="21" fill="#e6edf3" font-weight="700" text-anchor="start" letter-spacing="0">StandNote.AI</text><text x="554.0" y="50.0" font-size="13.5" fill="#58a6ff" font-weight="400" text-anchor="end" letter-spacing="0">repo ↗</text><text x="112.0" y="78.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Real-time meeting intelligence that runs beside</text><text x="112.0" y="102.0" font-size="15" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Meet, Zoom and Teams — it never hosts the call.</text><text x="112.0" y="128.0" font-size="13.5" fill="#7d8590" font-weight="400" text-anchor="start" letter-spacing="0">Live captions · Summaries · Action items</text><line x1="26" y1="136" x2="554" y2="136" stroke="#202833" stroke-width="1.2"/><text x="26.0" y="164.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">WORKS</text><text x="118.0" y="164.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">Tab audio → WebSocket → Whisper captions, saved</text><text x="118.0" y="185.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">transcripts, Llama 3 summaries and action items.</text><text x="26.0" y="218.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.2">HARD PART</text><text x="118.0" y="218.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">One recorder socket, many listeners; dead listeners</text><text x="118.0" y="239.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">are pruned mid-broadcast so the stream never</text><text x="118.0" y="260.0" font-size="14" fill="#c9d1d9" font-weight="400" text-anchor="start" letter-spacing="0">stalls.</text><text x="26.0" y="295.0" font-size="12" fill="#3ddc97" font-weight="700" text-anchor="start" letter-spacing="1.5">METRIC</text><text x="118.0" y="295.0" font-size="14" fill="#f0b429" font-weight="600" text-anchor="start" letter-spacing="0">&lt;2s caption latency · 5+ concurrent streams</text><rect x="26.0" y="336.0" width="75.4" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="63.7" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">FastAPI</text><rect x="109.4" y="336.0" width="98.2" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="158.5" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">WebSockets</text><rect x="215.6" y="336.0" width="98.2" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="264.8" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Chrome MV3</text><rect x="321.9" y="336.0" width="75.4" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="359.6" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">Whisper</text><rect x="405.2" y="336.0" width="98.2" height="26.5" rx="7" fill="#0b1f2a" stroke="#1f2a37" stroke-width="1.2"/><text x="454.4" y="353.8" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="middle" letter-spacing="0">PostgreSQL</text></svg>
